name: CRYPTO INFO website

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download website
        uses: actions/checkout@v4

      - name: Refresh latest YouTube video
        shell: bash
        run: |
          python - <<'PY'
          import html
          import json
          import pathlib
          import re
          import urllib.request

          target = pathlib.Path("youtube-latest.json")
          fallback = json.loads(target.read_text(encoding="utf-8"))
          feed = "https://www.youtube.com/feeds/videos.xml?channel_id=UCkoLtmxej9O7Oux_PAUP6aA"

          try:
              request = urllib.request.Request(feed, headers={"User-Agent": "Mozilla/5.0"})
              xml = urllib.request.urlopen(request, timeout=20).read().decode("utf-8")
              entry = re.search(r"<entry>[\s\S]*?</entry>", xml)
              video_id = re.search(r"<yt:videoId>([^<]+)</yt:videoId>", entry.group(0))
              title = re.search(r"<title>([\s\S]*?)</title>", entry.group(0))
              if not video_id:
                  raise RuntimeError("Latest video was not found")
              payload = {
                  "videoId": video_id.group(1),
                  "title": html.unescape(title.group(1)) if title else fallback["title"]
              }
          except Exception as error:
              print(f"YouTube feed fallback: {error}")
              payload = fallback

          target.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare website package
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
